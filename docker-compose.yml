version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: saude_postgres
    restart: always
    environment:
      POSTGRES_DB: dbsistemasaude
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data:

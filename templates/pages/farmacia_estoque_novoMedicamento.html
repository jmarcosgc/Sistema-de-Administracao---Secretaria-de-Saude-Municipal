<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.A.S.M.S. - Gerenciar Medicamento</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/farmacia_estoque_novoMedicamento.css') }}">
</head>
<body>

    <aside class="sidebar">
        <div class="logo">S.A.S.M.S.</div>
        <nav class="nav-buttons">
            <button class="btn-nav" id="btnEntregar" onclick="window.location.href='/entrega'">Entregar</button>
            <button class="btn-nav active" id="btnEstoque" onclick="window.location.href='/estoque'">Estoque</button>
        </nav>
        <div class="sidebar-footer">
            Seção: <strong>Farmacêutico</strong>
        </div>
    </aside>

    <main class="main-content">
        <h2 class="page-title">Adicionar Remédio</h2>

        <div class="form-container">
            <div class="form-group-nome">
                <label for="inputNome">Nome:</label>
                <input type="text" id="inputNome" placeholder="Digite o nome do remédio">
            </div>

            <div class="form-row">
                <select id="selectTipo" class="input-detail">
                    <option value="" disabled selected>Tipo</option>
                    <option value="Comprimido">Comprimido</option>
                    <option value="Xarope">Xarope</option>
                    <option value="Injetavel">Injetável</option>
                    <option value="Gotas">Gotas</option>
                    <option value="Pomada">Pomada</option>
                </select>

                <select id="selectUnidade" class="input-detail">
                    <option value="" disabled selected>Unidade</option>
                    <option value="mg">mg</option>
                    <option value="ml">ml</option>
                    <option value="g">g</option>
                    <option value="un">un</option>
                </select>

                <input type="number" id="inputQtdMin" class="input-detail" placeholder="Qtd mínima">
                <input type="number" id="inputQtdCaixa" class="input-detail" placeholder="Qtd por caixa">
            </div>
            
        </div>

        <div class="footer-action">
            <button id="btnCadastrar" class="btn-cadastrar">
                <i class="fas fa-plus"></i> Cadastrar Remédio
            </button>
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script src="{{ url_for('static', filename='js/adicionar_remedio.js') }}"></script>
</body>
</html>
